<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datenschutzerklärung — Schröder & Scholz</title>
<style>
  :root, :root[data-theme="light"] { --bg:#f3f2ef; --panel:#ffffff; --text:#201e1b; --muted:#6f6a61; --accent:#eab308; --accent-text:#87680c; --border:#e2ddd3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#eab308; --accent-text:#eec33a; --border:#2a3441; } }
  :root[data-theme="dark"] { --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#eab308; --accent-text:#eec33a; --border:#2a3441; }
  .wm-tx { fill: var(--text); } .wm-sub { fill: var(--muted); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.65; font-size:15px; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 22px 60px; }
  .logo { display:flex; align-items:center; margin-bottom:8px; }
  h1 { font-size:24px; margin:24px 0 6px; font-weight:800; }
  h2 { font-size:17px; margin:26px 0 8px; font-weight:700; color:var(--accent-text); }
  p { margin-bottom:12px; color:var(--text); }
  .meta { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .box { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
  a { color:var(--accent-text); }
  .lang-toggle { position:fixed; top:14px; right:14px; display:flex; gap:4px; }
  .lang-toggle button { background:var(--panel); border:1px solid var(--border); border-radius:7px; color:var(--muted); padding:5px 11px; cursor:pointer; font-weight:700; font-size:12px; }
  .lang-toggle button.on { background:var(--accent); color:#171717; border-color:var(--accent-text); }
  .back { display:inline-block; margin-top:24px; color:var(--accent-text); text-decoration:none; font-weight:600; }
  ul { margin:0 0 12px 20px; color:var(--text); }
  li { margin-bottom:5px; }
</style>
<script>(function(){try{var t=localStorage.getItem('rp_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<div class="lang-toggle">
  <button id="dl-de" class="on" onclick="setDsLang('de')">DE</button>
  <button id="dl-en" onclick="setDsLang('en')">EN</button>
</div>
<div class="wrap">
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 100" width="240" height="43"><text x="0" y="52" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="-1.5" class="wm-tx">SCHRÖDER <tspan fill="#eab308">&amp;</tspan> SCHOLZ</text><rect x="2" y="68" width="46" height="5" fill="#eab308"/><text x="58" y="74" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" class="wm-sub">REIFENSERVICE UND FAHRZEUGTECHNIK</text></svg>
  </div>
  <div id="ds-content"></div>
  <a href="./" class="back">← Zurück zum Portal</a>
</div>

<script>
var API = (location.pathname.indexOf('/reifenpro/') === 0) ? '/reifenpro/api/portal' : '/api/portal';
var FIRMA = {};
var DSLANG = 'de';

function setDsLang(l) {
  DSLANG = l;
  document.getElementById('dl-de').classList.toggle('on', l==='de');
  document.getElementById('dl-en').classList.toggle('on', l==='en');
  document.documentElement.lang = l;
  render();
}

function lade() {
  fetch(API + '/daten/firmendaten').then(function(r){return r.json();}).then(function(f){
    FIRMA = f || {};
    render();
  }).catch(function(){ render(); });
}

function render() {
  var f = FIRMA;
  var adresse = [f.strasse, (f.plz||'') + ' ' + (f.ort||'')].filter(function(x){return x && x.trim();}).join(', ');
  var firma = f.firmenname || 'Schröder & Scholz';
  var rechtsform = f.rechtsform || '';
  var inhaber = f.inhaber || '';
  var tel = f.telefon || '';
  var mail = f.email || '';
  var ustId = f.ust_id || '';
  var dsb = f.datenschutz_beauftragter || '';

  if (DSLANG === 'de') {
    document.getElementById('ds-content').innerHTML =
      '<h1>Datenschutzerklärung</h1>' +
      '<div class="meta">Gemäß Art. 13, 14 DSGVO · Stand: ' + new Date().toLocaleDateString('de-DE') + '</div>' +
      '<div class="box"><h2 style="margin-top:0">1. Verantwortlicher</h2>' +
      '<p>' + firma + (rechtsform ? ' (' + rechtsform + ')' : '') + '<br>' +
      (inhaber ? 'Inhaber/Geschäftsführer: ' + inhaber + '<br>' : '') +
      (adresse ? adresse + '<br>' : '') +
      (tel ? 'Telefon: ' + tel + '<br>' : '') +
      (mail ? 'E-Mail: ' + mail : '') + '</p>' +
      (dsb ? '<p>Datenschutzbeauftragter: ' + dsb + '</p>' : '') + '</div>' +
      '<h2>2. Welche Daten wir verarbeiten</h2>' +
      '<p>Im Rahmen unseres Reifenservice- und Einlagerungsgeschäfts sowie des Kundenportals verarbeiten wir:</p>' +
      '<ul><li>Stammdaten: Name, Anschrift, Telefonnummer, E-Mail-Adresse; bei Firmenkunden zusätzlich Firmenname und Umsatzsteuer-Identifikationsnummer</li>' +
      '<li>Fahrzeugdaten: Kennzeichen, Marke, Modell, Fahrzeugart, Erstzulassung und Termin der nächsten Hauptuntersuchung</li>' +
      '<li>Reifendaten: Dimension, Marke und Modell, Anzahl, Felgenart, Profiltiefe je Rad, DOT-Nummer, Lagerplatz, Status und Bemerkungen</li>' +
      '<li>Termindaten: gebuchte Leistungen mit Preis, Datum, Uhrzeit, ein etwaiger Gutscheincode sowie die Angabe, ob der Termin am Tresen, telefonisch oder online vereinbart wurde</li>' +
      '<li>Abrechnungsdaten: Rechnungsnummer, Rechnungsempfänger mit Anschrift, Positionen und Beträge, Zahlungsstatus</li>' +
      '<li>Zugangsdaten für das Kundenportal: E-Mail-Adresse und Ihr Passwort, das nur als nicht zurückrechenbarer Prüfwert gespeichert wird — das Passwort selbst kennen wir nicht</li></ul>' +
      '<h3>Zustimmung zum vorzeitigen Leistungsbeginn</h3>' +
      '<p>Haben Sie einen Termin online oder telefonisch vereinbart, steht Ihnen ein vierzehntägiges Widerrufsrecht zu. Soll die Arbeit schon vor Ablauf dieser Frist ausgeführt werden, benötigen wir dafür Ihre ausdrückliche Zustimmung. Erteilen Sie sie, speichern wir zum Nachweis den Zeitpunkt, Ihre IP-Adresse und die Angabe, ob die Zustimmung über einen Bestätigungslink oder telefonisch erteilt wurde. Rechtsgrundlage ist die Erfüllung des Vertrages sowie unsere Pflicht, diese Erklärung belegen zu können (Art. 6 Abs. 1 lit. b und lit. c DSGVO).</p>' +
      '<h3>Widerruf</h3>' +
      '<p>Erklären Sie einen Widerruf über die Schaltfläche „Vertrag widerrufen" auf unserer Website, verarbeiten wir Ihren Namen, Ihre Angaben zum Vertrag, Ihre E-Mail-Adresse für die gesetzlich vorgeschriebene Eingangsbestätigung sowie den Zeitpunkt des Eingangs und Ihre IP-Adresse. Der Eingangszeitpunkt ist die Tatsache, die Ihre Frist wahrt; wir müssen ihn deshalb belegen können. Rechtsgrundlage sind § 356a BGB und Art. 6 Abs. 1 lit. c DSGVO. Diese Angaben bewahren wir für die Dauer der gesetzlichen Aufbewahrungsfristen auf (Ziffer 4).</p>' +
      '<h3>Unterschriften</h3>' +
      '<p>Bei Einlagerungsverträgen und Arbeitsprotokollen unterschreiben Sie bei uns im Betrieb auf einem Bildschirm. Wir speichern das Bild Ihrer Unterschrift zusammen mit dem Dokument, Ihrem Namen und dem Zeitpunkt. Die Unterschrift dient allein dem Nachweis des jeweiligen Vorgangs und wird für nichts anderes verwendet. Rechtsgrundlage ist die Erfüllung des Vertrages (Art. 6 Abs. 1 lit. b DSGVO); die Aufbewahrung richtet sich nach Ziffer 4.</p>' +
      '<h3>Anfrage als Gewerbekunde</h3>' +
      '<p>Fragen Sie über unser Formular Konditionen als Gewerbekunde an, verarbeiten wir Firmenname, Ansprechpartner, Anrede, Umsatzsteuer-Identifikationsnummer, Telefonnummer, E-Mail-Adresse, die Zahl Ihrer Fahrzeuge, Ihre Nachricht sowie Ihre IP-Adresse. Laden Sie einen Nachweis Ihrer Gewerbeeigenschaft hoch, speichern wir auch dieses Dokument. Rechtsgrundlage ist die Anbahnung eines Vertrages (Art. 6 Abs. 1 lit. b DSGVO); die IP-Adresse dient dem Schutz vor automatisiertem Missbrauch (Art. 6 Abs. 1 lit. f DSGVO).</p>' +
      '<h3>Zugriffsprotokolle und Besucherzahlen</h3>' +
      '<p>Jeder Aufruf unserer Website wird in den Zugriffsprotokollen unseres eigenen Servers festgehalten: aufgerufene Adresse, Zeitpunkt, Antwortstatus, verweisende Seite und Browserkennung. Diese Protokolle werten wir aus, um zu sehen, wie viele Menschen unsere Seiten besuchen und welche Seiten gefragt sind. Die Auswertung geschieht auf unserem eigenen Server; es wird kein externer Dienst eingebunden, es werden keine Cookies gesetzt und es findet keine Wiedererkennung über Besuche hinweg statt. Die Protokolle werden spätestens nach 15 Tagen gelöscht. Rechtsgrundlage ist unser berechtigtes Interesse am sicheren Betrieb und an einer einfachen Reichweitenmessung (Art. 6 Abs. 1 lit. f DSGVO).</p>' +
      '<h3>Zahlung vor Ort</h3>' +
      '<p>Zahlen Sie bei uns im Betrieb bar oder mit Karte, wird der Zahlvorgang in unserem Kassensystem erfasst. Dieses System ist gesetzlich vorgeschrieben (§ 146a AO) und protokolliert jeden Vorgang unveränderbar. Erfasst werden der Betrag, die Zahlungsart, der Zeitpunkt und — zur Zuordnung — Ihr Name und Ihr Kennzeichen. Rechtsgrundlage ist unsere gesetzliche Aufzeichnungspflicht (Art. 6 Abs. 1 lit. c DSGVO).</p>' +
      '<h3>Terminbuchung ohne Kundenkonto</h3>' +
      '<p>Buchen Sie einen Termin über unsere Terminseite, ohne ein Kundenkonto zu haben, verarbeiten wir: Anrede, Vor- und Nachname (bei Firmenkunden zusätzlich den Firmennamen), Telefonnummer, E-Mail-Adresse, Anschrift, Kennzeichen, Fahrzeugart und Zollgröße, die gewünschten Leistungen sowie einen etwaigen Gutscheincode. Anschrift und Name benötigen wir, um die Leistung abrechnen zu können; die Fahrzeugangaben, um die passenden Arbeiten und Zeiten einzuplanen.</p>' +
      '<p>Wir versenden Ihnen zunächst eine E-Mail mit einem Bestätigungslink; erst nach Ihrer Bestätigung wird der Termin verbindlich. Bestätigen Sie nicht, wird die Anfrage nach 45 Minuten automatisch gelöscht. Dieses Verfahren schützt davor, dass Dritte Termine unter fremden E-Mail-Adressen buchen. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO (Durchführung vorvertraglicher Maßnahmen und des Vertrages).</p>' +
      // Formulierung mit admin-c2 abgestimmt und am Code geprueft. Zwei Aussagen aus dem ersten
      // Entwurf sind bewusst NICHT enthalten, weil sie nachweislich falsch waren: "Wir speichern
      // die Suchbegriffe nicht" (sie standen im Zugriffsprotokoll) und "und nicht ausgewertet"
      // (das Protokoll wird fuer die Besucherzahlen ausgewertet). Sobald der Suchbegriff auf
      // ALLEN Ebenen aus den Protokollen heraus ist, wird hier auf die staerkere Fassung
      // gewechselt -- gemeinsam, nicht einseitig.
      '<p>Wenn Sie eine Anschrift eingeben, schlagen wir Ihnen passende Straßen, Postleitzahlen und Orte vor. Dazu fragt <strong>unser Server – nicht Ihr Browser</strong> bei den Kartendiensten Photon (photon.komoot.io, OpenStreetMap-Daten) und OpenPLZ (openplzapi.org, amtliche Daten) an. Übermittelt wird ausschließlich der eingegebene Suchbegriff, also der Anfang der Straße und gegebenenfalls die Postleitzahl. Ihre IP-Adresse, Ihr Name und alle übrigen Daten bleiben bei uns; die Dienste erfahren nicht, wer sucht. Wie jeder Aufruf unserer Anwendung wird die Anfrage in den Zugriffsprotokollen unseres eigenen Servers festgehalten; diese Protokolle werden spätestens nach 15 Tagen gelöscht. Rechtsgrundlage ist unser berechtigtes Interesse an einer korrekten Anschrift (Art. 6 Abs. 1 lit. f DSGVO). Sie können die Adresse auch ohne Vorschläge von Hand eintragen.</p>' +
      '<p>Erteilen Sie uns eine Einwilligung (z. B. für Saison-Erinnerungen oder eine einmalige Bewertungsanfrage), speichern wir zum Nachweis zusätzlich den Zeitpunkt und Ihre IP-Adresse. Jede dieser E-Mails enthält einen Abmeldelink, mit dem Sie die Einwilligung mit einem Klick widerrufen können.</p>' +
      '<h3>Kontaktformular</h3>' +
      '<p>Schreiben Sie uns über das Kontaktformular unserer Website, verarbeiten wir Ihren Namen, Ihre E-Mail-Adresse, auf Wunsch Ihre Telefonnummer, Ihre Nachricht sowie Ihre IP-Adresse. Die IP-Adresse dient allein dem Schutz vor automatisiertem Missbrauch. Wir nutzen diese Angaben ausschließlich, um Ihre Anfrage zu beantworten; Rechtsgrundlage ist unser berechtigtes Interesse an der Beantwortung von Anfragen (Art. 6 Abs. 1 lit. f DSGVO), bei Anfragen zu einem möglichen Auftrag Art. 6 Abs. 1 lit. b DSGVO. Eine Weitergabe an Dritte erfolgt nicht. Anfragen, aus denen sich kein Geschäftsvorgang ergibt, löschen wir, sobald sie erledigt sind; führt die Anfrage zu einem Auftrag, gelten die Fristen unter Ziffer 4.</p>' +
      '<h3>Karte (Google Maps)</h3>' +
      '<p>Auf unserer Website zeigen wir unseren Standort auf einer Karte von Google Maps. Die Karte wird <strong>nicht automatisch geladen</strong>: Sie sehen zunächst nur eine Platzhalterfläche, und erst wenn Sie auf „Karte anzeigen“ klicken, wird die Karte nachgeladen. Mit diesem Klick willigen Sie in die Übertragung ein (Art. 6 Abs. 1 lit. a DSGVO, § 25 Abs. 1 TTDSG). Dabei werden Ihre IP-Adresse und Angaben zu Ihrem Gerät an Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Irland übertragen; eine Verarbeitung in den USA ist dabei nicht ausgeschlossen. Klicken Sie nicht, werden keine Daten an Google übertragen. Näheres unter policies.google.com/privacy.</p>' +
      '<h2>3. Zweck und Rechtsgrundlage</h2>' +
      '<p>Die Verarbeitung erfolgt zur Erfüllung des Vertrages (Art. 6 Abs. 1 lit. b DSGVO), zur Erfüllung gesetzlicher Aufbewahrungspflichten (Art. 6 Abs. 1 lit. c DSGVO) sowie – bei Saison-Erinnerungen – auf Grundlage Ihrer Einwilligung (Art. 6 Abs. 1 lit. a DSGVO), die Sie jederzeit widerrufen können.</p>' +
      '<h2>4. Speicherdauer</h2>' +
      '<p>Vertragsdaten werden für die Dauer der Geschäftsbeziehung verarbeitet. Nach deren Beendigung gelten die gesetzlichen Aufbewahrungsfristen: Rechnungen und Buchungsbelege 8 Jahre (§ 147 Abs. 3 AO, § 14b Abs. 1 UStG in der Fassung des Vierten Bürokratieentlastungsgesetzes), Vertragsunterlagen 8 Jahre ab Vertragsende, sonstige Geschäftskorrespondenz 6 Jahre (§ 257 HGB). Danach werden die Daten gelöscht.</p>' +
      '<p>Abweichend davon gelten kürzere Fristen: Zugriffsprotokolle werden spätestens nach 15 Tagen gelöscht. Eine nicht bestätigte Terminanfrage wird nach 45 Minuten gelöscht. Kontaktanfragen, aus denen sich kein Geschäftsvorgang ergibt, löschen wir, sobald sie erledigt sind.</p>' +
      '<p>Verlangen Sie die Löschung Ihrer Daten und bestehen für einen Teil davon noch Aufbewahrungspflichten, löschen wir alles Übrige und machen den Rest unkenntlich: Name, Anschrift, Telefonnummer, E-Mail-Adresse, Kennzeichen und freie Bemerkungen werden entfernt. Erhalten bleibt nur, was der Beleg selbst braucht.</p>' +
      // NACHZUTRAGEN, sobald die technische Sicherheitseinrichtung der Kasse eingerichtet ist:
      // Der TSE-Anbieter (derzeit fiskaly) ist dann Auftragsverarbeiter und gehoert in diese
      // Aufzaehlung. Er wird hier bewusst NICHT vorab genannt -- ein behaupteter Vertrag nach
      // Art. 28 DSGVO, den es noch nicht gibt, waere schlimmer als die Luecke. Stand 09.09.2026:
      // kein fiskaly-Zugang vorhanden, health der Kasse meldet tseKonfiguriert:false.
      '<h2>5. Auftragsverarbeiter</h2>' +
      '<p>Wir setzen sorgfältig ausgewählte Dienstleister ein, mit denen Verträge zur Auftragsverarbeitung nach Art. 28 DSGVO bestehen: Server-Hosting (Contabo GmbH, München) und E-Mail-Versand (IONOS SE, Montabaur). Eine Weitergabe an Dritte zu anderen Zwecken erfolgt nicht.</p>' +
      '<h2>6. Ihre Rechte</h2>' +
      '<p>Sie haben das Recht auf Auskunft (Art. 15), Berichtigung (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18), Datenübertragbarkeit (Art. 20) und Widerspruch (Art. 21). Sie können eine erteilte Einwilligung jederzeit widerrufen.</p>' +
      '<h2>7. Beschwerderecht</h2>' +
      '<p>Sie haben das Recht, sich bei einer Aufsichtsbehörde zu beschweren. Zuständig ist:<br>' +
      // Zustaendig ist die Behoerde am Sitz des Betriebs -- Leipzig, also Sachsen. Hier stand das
      // bayerische Landesamt; eine falsche Aufsichtsbehoerde schickt Beschwerdefuehrer in die Irre
      // (Art. 13 Abs. 2 lit. d DSGVO). Angaben an der Quelle geprueft (datenschutz.sachsen.de):
      // Die Behoerde heisst seit einiger Zeit "Datenschutz- UND Transparenzbeauftragte", und fuer
      // Post gilt das Postfach, nicht die Hausanschrift.
      'Die Sächsische Datenschutz- und Transparenzbeauftragte<br>Postfach 11 01 32, 01330 Dresden<br>Telefon: +49 351 85471-101<br>E-Mail: post@sdtb.sachsen.de<br>www.datenschutz.sachsen.de</p>';
  } else {
    document.getElementById('ds-content').innerHTML =
      '<h1>Privacy Policy</h1>' +
      '<div class="meta">Pursuant to Art. 13, 14 GDPR · As of: ' + new Date().toLocaleDateString('en-GB') + '</div>' +
      '<div class="box"><h2 style="margin-top:0">1. Controller</h2>' +
      '<p>' + firma + (rechtsform ? ' (' + rechtsform + ')' : '') + '<br>' +
      (inhaber ? 'Owner/Managing Director: ' + inhaber + '<br>' : '') +
      (adresse ? adresse + '<br>' : '') +
      (tel ? 'Phone: ' + tel + '<br>' : '') +
      (mail ? 'Email: ' + mail : '') + '</p>' +
      (dsb ? '<p>Data Protection Officer: ' + dsb + '</p>' : '') + '</div>' +
      '<h2>2. Data we process</h2>' +
      '<p>As part of our tire service, storage business and customer portal, we process:</p>' +
      '<ul><li>Master data: name, address, phone number, email address; for business customers also company name and VAT identification number</li>' +
      '<li>Vehicle data: licence plate, make, model, vehicle type, date of first registration and the date of the next roadworthiness test</li>' +
      '<li>Tyre data: dimensions, brand and model, quantity, rim type, tread depth per wheel, DOT number, storage location, status and notes</li>' +
      '<li>Appointment data: booked services with prices, date, time, any voucher code, and whether the appointment was made at the counter, by telephone or online</li>' +
      '<li>Billing data: invoice number, invoice recipient with address, line items and amounts, payment status</li>' +
      '<li>Portal login data: email address and your password, stored only as an irreversible check value — we do not know the password itself</li></ul>' +
      '<h3>Consent to start work before the withdrawal period ends</h3>' +
      '<p>If you arranged an appointment online or by telephone, you have a fourteen-day right of withdrawal. If the work is to be carried out before that period ends, we need your express consent. Where you give it, we store the time, your IP address and whether the consent was given via a confirmation link or by telephone, as evidence. The legal basis is performance of the contract and our obligation to be able to prove this declaration (Art. 6(1)(b) and (c) GDPR).</p>' +
      '<h3>Withdrawal</h3>' +
      '<p>If you declare a withdrawal using the &ldquo;Withdraw from contract&rdquo; function on our website, we process your name, your details of the contract, your email address for the legally required confirmation of receipt, as well as the time of receipt and your IP address. The time of receipt is the fact that preserves your deadline, so we must be able to prove it. The legal basis is § 356a BGB and Art. 6(1)(c) GDPR. We keep these details for the statutory retention periods (section 4).</p>' +
      '<h3>Signatures</h3>' +
      '<p>For storage contracts and work records you sign on a screen at our premises. We store the image of your signature together with the document, your name and the time. The signature serves solely as evidence of that transaction and is not used for anything else. The legal basis is performance of the contract (Art. 6(1)(b) GDPR); retention follows section 4.</p>' +
      '<h3>Business customer enquiry</h3>' +
      '<p>If you use our form to enquire about business terms, we process company name, contact person, form of address, VAT identification number, phone number, email address, the number of your vehicles, your message and your IP address. If you upload evidence of your business status, we store that document as well. The legal basis is the initiation of a contract (Art. 6(1)(b) GDPR); the IP address serves to protect against automated abuse (Art. 6(1)(f) GDPR).</p>' +
      '<h3>Access logs and visitor numbers</h3>' +
      '<p>Every request to our website is recorded in the access logs of our own server: the address requested, the time, the response status, the referring page and the browser identifier. We evaluate these logs to see how many people visit our pages and which pages are in demand. The evaluation runs on our own server; no external service is involved, no cookies are set and there is no recognition across visits. The logs are deleted after 15 days at the latest. The legal basis is our legitimate interest in secure operation and in basic reach measurement (Art. 6(1)(f) GDPR).</p>' +
      '<h3>Payment on site</h3>' +
      '<p>If you pay in cash or by card at our premises, the payment is recorded in our point-of-sale system. That system is required by law (§ 146a AO) and records every transaction in a tamper-evident manner. Recorded are the amount, the payment method, the time and — for allocation — your name and licence plate. The legal basis is our statutory recording obligation (Art. 6(1)(c) GDPR).</p>' +
      '<h3>Booking an appointment without a customer account</h3>' +
      '<p>If you book an appointment via our booking page without holding an account, we process: form of address, first and last name (for business customers also the company name), phone number, email address, postal address, licence plate, vehicle type and wheel size, the selected services and any voucher code. Name and address are required to invoice the service; the vehicle details to schedule the right work and duration.</p>' +
      '<p>We first send you an email containing a confirmation link; the appointment only becomes binding once you confirm it. Without confirmation the request is deleted automatically after 45 minutes. This protects against third parties booking appointments under someone else&rsquo;s email address. The legal basis is Art. 6(1)(b) GDPR (pre-contractual measures and performance of the contract).</p>' +
      '<p>When you enter an address, we suggest matching streets, postcodes and towns. To do so, <strong>our server &ndash; not your browser</strong> queries the mapping services Photon (photon.komoot.io, OpenStreetMap data) and OpenPLZ (openplzapi.org, official records). Only the search term you typed is transmitted, i.e. the beginning of the street and possibly the postcode. Your IP address, your name and all other data stay with us; the services do not learn who is searching. Like every request to our application, the query is recorded in the access logs of our own server; these logs are deleted after 15 days at the latest. The legal basis is our legitimate interest in a correct address (Art. 6(1)(f) GDPR). You can also enter the address by hand, without suggestions.</p>' +
      '<p>If you give us consent (for example for seasonal reminders or a one-off review request), we additionally store the time and your IP address as evidence. Every such email contains an unsubscribe link that withdraws the consent with a single click.</p>' +
      '<h3>Contact form</h3>' +
      '<p>If you write to us via the contact form on our website, we process your name, email address, optionally your phone number, your message and your IP address. The IP address serves solely to protect against automated abuse. We use these details exclusively to answer your enquiry; the legal basis is our legitimate interest in responding to enquiries (Art. 6(1)(f) GDPR), or Art. 6(1)(b) GDPR where the enquiry concerns a potential order. The data is not passed on to third parties. Enquiries that do not lead to a business transaction are deleted once they have been dealt with; if the enquiry leads to an order, the periods under section 4 apply.</p>' +
      '<h3>Map (Google Maps)</h3>' +
      '<p>Our website shows our location on a Google Maps map. The map is <strong>not loaded automatically</strong>: you first see a placeholder, and the map is only loaded once you click &ldquo;Show map&rdquo;. With that click you consent to the transfer (Art. 6(1)(a) GDPR, § 25(1) TTDSG). Your IP address and details about your device are then transmitted to Google Ireland Limited, Gordon House, Barrow Street, Dublin 4, Ireland; processing in the USA cannot be ruled out. If you do not click, no data is transmitted to Google. For details see policies.google.com/privacy.</p>' +
      '<h2>3. Purpose and legal basis</h2>' +
      '<p>Processing is carried out to fulfill the contract (Art. 6(1)(b) GDPR), to comply with legal retention obligations (Art. 6(1)(c) GDPR) and – for seasonal reminders – based on your consent (Art. 6(1)(a) GDPR), which you can withdraw at any time.</p>' +
      '<h2>4. Retention period</h2>' +
      '<p>Contract data is processed for the duration of the business relationship. After termination, statutory retention periods apply: invoices and accounting documents 8 years (§ 147 (3) AO, § 14b (1) UStG as amended by the Fourth Bureaucracy Relief Act), contract documents 8 years from end of contract, other business correspondence 6 years (§ 257 HGB). The data is then deleted.</p>' +
      '<p>Shorter periods apply in some cases: access logs are deleted after 15 days at the latest. An unconfirmed appointment request is deleted after 45 minutes. Contact enquiries that do not lead to a business transaction are deleted once they have been dealt with.</p>' +
      '<p>If you request erasure and retention obligations still apply to part of your data, we delete everything else and render the remainder unidentifiable: name, address, phone number, email address, licence plate and free-text notes are removed. Only what the accounting record itself requires is kept.</p>' +
      '<h2>5. Processors</h2>' +
      '<p>We use carefully selected service providers with whom data processing agreements pursuant to Art. 28 GDPR exist: server hosting (Contabo GmbH, Munich) and email delivery (IONOS SE, Montabaur). No data is shared with third parties for other purposes.</p>' +
      '<h2>6. Your rights</h2>' +
      '<p>You have the right to access (Art. 15), rectification (Art. 16), erasure (Art. 17), restriction of processing (Art. 18), data portability (Art. 20) and objection (Art. 21). You can withdraw consent at any time.</p>' +
      '<h2>7. Right to complain</h2>' +
      '<p>You have the right to lodge a complaint with a supervisory authority. The competent authority is:<br>' +
      'Saxon Commissioner for Data Protection and Transparency<br>Postfach 11 01 32, 01330 Dresden, Germany<br>Phone: +49 351 85471-101<br>Email: post@sdtb.sachsen.de<br>www.datenschutz.sachsen.de</p>';
