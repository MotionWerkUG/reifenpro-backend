<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGB — Schröder & Scholz</title>
<style>
  :root, :root[data-theme="light"] { --bg:#f3f2ef; --panel:#ffffff; --text:#201e1b; --muted:#6f6a61; --accent:#eab308; --accent-text:#87680c; --border:#e2ddd3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#eab308; --accent-text:#eec33a; --border:#2a3441; } }
  :root[data-theme="dark"] { --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --accent:#eab308; --accent-text:#eec33a; --border:#2a3441; }
  .wm-tx { fill: var(--text); } .wm-sub { fill: var(--muted); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.65; font-size:15px; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 22px 60px; }
  .logo { display:flex; align-items:center; margin-bottom:8px; }
  h1 { font-size:24px; margin:24px 0 6px; font-weight:800; }
  h2 { font-size:17px; margin:26px 0 8px; font-weight:700; color:var(--accent-text); }
  p { margin-bottom:12px; color:var(--text); }
  .meta { color:var(--muted); font-size:13px; margin-bottom:20px; }
  a { color:var(--accent-text); }
  .lang-toggle { position:fixed; top:14px; right:14px; display:flex; gap:4px; }
  .lang-toggle button { background:var(--panel); border:1px solid var(--border); border-radius:7px; color:var(--muted); padding:5px 11px; cursor:pointer; font-weight:700; font-size:12px; }
  .lang-toggle button.on { background:var(--accent); color:#171717; border-color:var(--accent-text); }
  .back { display:inline-block; margin-top:24px; color:var(--accent-text); text-decoration:none; font-weight:600; }
  .hinweis { background:rgba(234,179,8,0.08); border:1px solid rgba(234,179,8,0.25); border-radius:10px; padding:14px 16px; font-size:13px; color:var(--muted); margin-top:20px; }
</style>
<script>(function(){try{var t=localStorage.getItem('rp_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<div class="lang-toggle">
  <button id="al-de" class="on" onclick="setAgbLang('de')">DE</button>
  <button id="al-en" onclick="setAgbLang('en')">EN</button>
</div>
<div class="wrap">
  <div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 100" width="240" height="43"><text x="0" y="52" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="-1.5" class="wm-tx">SCHRÖDER <tspan fill="#eab308">&amp;</tspan> SCHOLZ</text><rect x="2" y="68" width="46" height="5" fill="#eab308"/><text x="58" y="74" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3.5" class="wm-sub">REIFENSERVICE UND FAHRZEUGTECHNIK</text></svg>
  </div>
  <div id="agb-content"></div>
  <div class="hinweis" id="agb-hinweis"></div>
  <a href="./" class="back">← Zurück zum Portal</a>
</div>

<script>
var API = (location.pathname.indexOf('/reifenpro/') === 0) ? '/reifenpro/api/portal' : '/api/portal';
var FIRMA = {};
var AGBLANG = 'de';

function setAgbLang(l) {
  AGBLANG = l;
  document.getElementById('al-de').classList.toggle('on', l==='de');
  document.getElementById('al-en').classList.toggle('on', l==='en');
  document.documentElement.lang = l;
  render();
}

function lade() {
  fetch(API + '/daten/firmendaten').then(function(r){return r.json();}).then(function(f){
    FIRMA = f || {};
    render();
  }).catch(function(){ render(); });
}

function render() {
  var f = FIRMA;
  var firma = f.firmenname || 'Schröder & Scholz';
  var vertragsdauer = f.vertragsdauer_monate || 6;
  var abholfrist = f.abholungsfrist_wochen || f.abholfrist_wochen || 4;
  var stornoFrist = f.stornierung_frist_h != null ? f.stornierung_frist_h : 24;
  var lagerort = f.lagerungsort || 'in unserem Betrieb';

  if (AGBLANG === 'de') {
    document.getElementById('agb-content').innerHTML =
      '<h1>Allgemeine Geschäftsbedingungen</h1>' +
      '<div class="meta">Stand: ' + new Date().toLocaleDateString('de-DE') + '</div>' +
      '<h2>1. Geltungsbereich</h2>' +
      '<p>Diese Allgemeinen Geschäftsbedingungen gelten für alle Verträge über Reifenservice-, Räderwechsel- und Einlagerungsleistungen zwischen ' + firma + ' (nachfolgend "wir") und dem Kunden sowie für die Nutzung des Kundenportals.</p>' +
      '<h2>2. Einlagerung</h2>' +
      '<p>Wir lagern die uns übergebenen Räder und Reifen sachgerecht ' + lagerort + '. Die Standard-Vertragsdauer der Einlagerung beträgt ' + vertragsdauer + ' Monate und verlängert sich, sofern nicht gekündigt, saisonüblich. Die Räder bleiben im Eigentum des Kunden.</p>' +
      '<h2>3. Abholung</h2>' +
      '<p>Nach Beendigung des Einlagerungsvertrages ist der Kunde verpflichtet, die eingelagerten Räder innerhalb von ' + abholfrist + ' Wochen abzuholen. Nach Ablauf dieser Frist sind wir berechtigt, ein angemessenes Lagerentgelt zu berechnen.</p>' +
      '<h2>4. Terminbuchung und Stornierung</h2>' +
      '<p>Termine können online über das Kundenportal gebucht werden. Eine kostenlose Stornierung ist bis ' + stornoFrist + ' Stunden vor dem Termin möglich. Bei späterer Absage oder Nichterscheinen behalten wir uns vor, eine Ausfallpauschale zu berechnen.</p>' +
      '<h2>5. Preise und Zahlung</h2>' +
      '<p>Es gelten die zum Zeitpunkt der Leistungserbringung gültigen Preise. Die Zahlung ist nach Leistungserbringung fällig.</p>' +
      '<h2>6. Gewährleistung und Haftung</h2>' +
      '<p>Wir haften nach den gesetzlichen Bestimmungen. Für die fachgerechte Lagerung übernehmen wir die Verantwortung; für normale Alterung der Reifen (Materialermüdung) haften wir nicht. Eine Haftung für leichte Fahrlässigkeit ist auf den vertragstypischen, vorhersehbaren Schaden begrenzt, soweit gesetzlich zulässig.</p>' +
      '<h2>7. Pflichten des Kunden</h2>' +
      '<p>Der Kunde ist verpflichtet, seine Kontaktdaten aktuell zu halten und uns über Änderungen zu informieren. Im Kundenportal hinterlegte Zugangsdaten sind vertraulich zu behandeln.</p>' +
      '<h2>8. Schlussbestimmungen</h2>' +
      '<p>Es gilt deutsches Recht. Sollten einzelne Bestimmungen unwirksam sein, bleibt die Wirksamkeit der übrigen Bestimmungen unberührt.</p>';
    document.getElementById('agb-hinweis').innerHTML =
      'Hinweis: Diese AGB sind ein anpassbares Muster und sollten vor dem produktiven Einsatz durch einen Rechtsanwalt geprüft werden, um eine vollständige rechtliche Absicherung zu gewährleisten.';
  } else {
    document.getElementById('agb-content').innerHTML =
      '<h1>Terms and Conditions</h1>' +
      '<div class="meta">As of: ' + new Date().toLocaleDateString('en-GB') + '</div>' +
      '<h2>1. Scope</h2>' +
      '<p>These terms and conditions apply to all contracts for tire service, wheel change and storage services between ' + firma + ' (hereinafter "we") and the customer, as well as to the use of the customer portal.</p>' +
      '<h2>2. Storage</h2>' +
      '<p>We store the wheels and tires handed over to us properly ' + lagerort + '. The standard contract duration for storage is ' + vertragsdauer + ' months and is extended seasonally unless cancelled. The wheels remain the property of the customer.</p>' +
      '<h2>3. Collection</h2>' +
      '<p>After termination of the storage contract, the customer is obliged to collect the stored wheels within ' + abholfrist + ' weeks. After this period, we are entitled to charge a reasonable storage fee.</p>' +
      '<h2>4. Appointment booking and cancellation</h2>' +
      '<p>Appointments can be booked online via the customer portal. Free cancellation is possible up to ' + stornoFrist + ' hours before the appointment. For later cancellation or no-show, we reserve the right to charge a cancellation fee.</p>' +
      '<h2>5. Prices and payment</h2>' +
      '<p>The prices valid at the time the service is provided apply. Payment is due after the service has been provided.</p>' +
      '<h2>6. Warranty and liability</h2>' +
      '<p>We are liable in accordance with statutory provisions. We assume responsibility for proper storage; we are not liable for normal aging of tires (material fatigue). Liability for slight negligence is limited to the foreseeable damage typical for the contract, as far as legally permissible.</p>' +
      '<h2>7. Customer obligations</h2>' +
      '<p>The customer is obliged to keep their contact details up to date and to inform us of any changes. Login details stored in the customer portal must be treated confidentially.</p>' +
      '<h2>8. Final provisions</h2>' +
      '<p>German law applies. Should individual provisions be invalid, the validity of the remaining provisions remains unaffected.</p>';
    document.getElementById('agb-hinweis').innerHTML =
      'Note: These terms are an adaptable template and should be reviewed by a lawyer before productive use to ensure complete legal protection.';
  }
}
lade();
</script>
</body>
</html>
