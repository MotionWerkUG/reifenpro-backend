<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Unterschrift — Schröder &amp; Scholz</title>
<style>
  :root { --schwarz:#171717; --gold:#eab308; --grau:#6b7280; --hell:#f4f4f5; --linie:#e5e7eb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--hell);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; color:var(--schwarz); }
  body { display:flex; flex-direction:column; overscroll-behavior:none; }
  header { background:var(--schwarz); color:#fff; padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top));
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex:none; }
  .marke { font-size:17px; font-weight:800; letter-spacing:.5px; }
  .marke span { color:var(--gold); }
  .stationsname { font-size:12px; color:#a3a3a3; }
  .goldband { height:3px; background:var(--gold); flex:none; }
  main { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:20px; }
  .mitte { max-width:820px; margin:0 auto; }
  .karte { background:#fff; border:1px solid var(--linie); border-radius:14px; padding:24px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p.hinweis { color:var(--grau); font-size:15px; line-height:1.6; margin:0 0 18px; }
  .warte { text-align:center; padding:60px 20px; color:var(--grau); }
  .warte .gross { font-size:22px; color:var(--schwarz); margin-bottom:8px; }
  .puls { width:14px; height:14px; border-radius:50%; background:var(--gold); margin:0 auto 22px; animation:p 1.6s ease-in-out infinite; }
  @keyframes p { 0%,100% { opacity:.25; transform:scale(.85); } 50% { opacity:1; transform:scale(1.15); } }
  .dok { background:#fff; border:1px solid var(--linie); border-radius:12px; padding:22px; max-height:46vh;
    overflow:auto; -webkit-overflow-scrolling:touch; margin-bottom:16px; }
  .sigfeld { background:#fff; border:2px dashed var(--linie); border-radius:12px; padding:14px; }
  .sigtitel { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.9px; color:var(--grau); margin-bottom:10px; }
  canvas { width:100%; height:200px; background:#fff; border-bottom:2px solid var(--schwarz); border-radius:6px; touch-action:none; display:block; }
  .knopfreihe { display:flex; gap:12px; margin-top:18px; padding-bottom:env(safe-area-inset-bottom); }
  button { font-family:inherit; font-size:17px; font-weight:600; border-radius:12px; border:0; padding:16px 22px;
    min-height:56px; cursor:pointer; flex:1; }
  .b-haupt { background:var(--gold); color:var(--schwarz); }
  .b-haupt:disabled { opacity:.4; }
  .b-neben { background:#fff; color:var(--schwarz); border:1px solid var(--linie); }
  .code-eingabe { width:100%; font-size:34px; letter-spacing:12px; text-align:center; padding:18px; border:1px solid var(--linie);
    border-radius:12px; font-family:inherit; }
  .fehler { color:#c8402a; font-size:15px; margin-top:12px; min-height:22px; }
  .fertig { text-align:center; padding:50px 20px; }
  .haken { width:70px; height:70px; border-radius:50%; background:#dcfce7; color:#15803d; font-size:38px;
    display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
</style>
</head>
<body>
<header>
  <div class="marke">SCHRÖDER <span>&amp;</span> SCHOLZ</div>
  <div class="stationsname" id="stationsname"></div>
</header>
<div class="goldband"></div>
<main><div class="mitte" id="buehne"></div></main>

<script>
// Unterschriften-Station. Dieses Geraet hat KEIN Mitarbeiterkonto — es kennt nur sein
// eigenes Merkmal und darf damit ausschliesslich den aktuellen Auftrag lesen und eine
// Unterschrift zuruecksenden. Deshalb kann es hier auch nichts anderes anzeigen.
var API = '/api/station';
var GEHEIMNIS = localStorage.getItem('rp_station') || '';
var buehne = document.getElementById('buehne');
var aktAuftrag = null, sigCtx = null, hatStrich = false, umfrageTimer = null;

function kopf(name) { document.getElementById('stationsname').textContent = name || ''; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function anfrage(pfad, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ 'Content-Type': 'application/json', 'X-Station': GEHEIMNIS }, opt.headers || {});
  return fetch(API + pfad, opt).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (d) {
      if (!r.ok) { var e = new Error(d.error || 'Fehler'); e.code = d.code; e.status = r.status; throw e; }
      return d;
    });
  });
}

// ── Kopplung ──────────────────────────────────────────────────────────────────────
function zeigeKopplung(meldung) {
  buehne.innerHTML =
    '<div class="karte">' +
      '<h1>Gerät einrichten</h1>' +
      '<p class="hinweis">Öffne im ReifenPro-Admin die Einstellungen, lege dort eine Station an ' +
        'und gib den angezeigten sechsstelligen Code hier ein. Das ist einmalig nötig.</p>' +
      '<input class="code-eingabe" id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">' +
      '<div class="fehler" id="fehler">' + esc(meldung || '') + '</div>' +
      '<div class="knopfreihe"><button class="b-haupt" id="koppeln">Verbinden</button></div>' +
    '</div>';
  var feld = document.getElementById('code');
  feld.focus();
  document.getElementById('koppeln').onclick = function () {
    var code = (feld.value || '').trim();
    if (!/^\d{6}$/.test(code)) { document.getElementById('fehler').textContent = 'Bitte sechs Ziffern eingeben.'; return; }
    fetch(API + '/koppeln', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Fehler'); return d; }); })
      .then(function (d) {
        GEHEIMNIS = d.geheimnis;
        localStorage.setItem('rp_station', GEHEIMNIS);
        kopf(d.station);
        starteUmfrage();
      })
      .catch(function (e) { document.getElementById('fehler').textContent = e.message; });
  };
}

// ── Warten ────────────────────────────────────────────────────────────────────────
function zeigeWarten() {
  aktAuftrag = null;
  buehne.innerHTML =
    '<div class="karte warte">' +
      '<div class="puls"></div>' +
      '<div class="gross">Bereit</div>' +
      '<div>Sobald am Rechner ein Dokument geschickt wird, erscheint es hier.</div>' +
    '</div>';
}

// ── Dokument mit Unterschriftenfeld ───────────────────────────────────────────────
function zeigeAuftrag(a) {
  aktAuftrag = a;
  hatStrich = false;
  buehne.innerHTML =
    '<div class="karte">' +
      '<h1>' + esc(a.titel) + '</h1>' +
      '<p class="hinweis">' + (a.kunde_name ? 'Für ' + esc(a.kunde_name) + '. ' : '') +
        'Bitte lies das Dokument vollständig durch und unterschreibe darunter.</p>' +
      '<div class="dok" id="dok"></div>' +
      '<div class="sigfeld">' +
        '<div class="sigtitel">Unterschrift</div>' +
        '<canvas id="sig"></canvas>' +
      '</div>' +
      '<div class="knopfreihe">' +
        '<button class="b-neben" id="loeschen">Nochmal</button>' +
        '<button class="b-haupt" id="senden" disabled>Unterschrift bestätigen</button>' +
      '</div>' +
      '<div class="fehler" id="fehler"></div>' +
    '</div>';
  // Der Dokumenttext kommt vom eigenen Server und wird als HTML angezeigt — genau so, wie
  // er spaeter gespeichert wird. Der Kunde soll sehen, was er unterschreibt.
  document.getElementById('dok').innerHTML = a.inhalt_html;
  starteZeichnen();
  document.getElementById('loeschen').onclick = leereSig;
  document.getElementById('senden').onclick = sendeSig;
}

function starteZeichnen() {
  var c = document.getElementById('sig');
  var breite = c.clientWidth, hoehe = c.clientHeight;
  var dpr = window.devicePixelRatio || 1;
  c.width = breite * dpr; c.height = hoehe * dpr;
  sigCtx = c.getContext('2d');
  sigCtx.scale(dpr, dpr);
  sigCtx.lineWidth = 2.4; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round'; sigCtx.strokeStyle = '#171717';
  var zeichnet = false;
  function pos(ev) {
    var r = c.getBoundingClientRect();
    var q = ev.touches ? ev.touches[0] : ev;
    return { x: q.clientX - r.left, y: q.clientY - r.top };
  }
  function start(ev) { ev.preventDefault(); zeichnet = true; var p = pos(ev); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); }
  function zug(ev) {
    if (!zeichnet) return; ev.preventDefault();
    var p = pos(ev); sigCtx.lineTo(p.x, p.y); sigCtx.stroke();
    if (!hatStrich) { hatStrich = true; document.getElementById('senden').disabled = false; }
  }
  function ende() { zeichnet = false; }
  c.addEventListener('pointerdown', start); c.addEventListener('pointermove', zug);
  c.addEventListener('pointerup', ende); c.addEventListener('pointerleave', ende);
  c.addEventListener('touchstart', start, { passive: false });
  c.addEventListener('touchmove', zug, { passive: false });
  c.addEventListener('touchend', ende);
}

function leereSig() {
  var c = document.getElementById('sig');
  if (sigCtx) sigCtx.clearRect(0, 0, c.width, c.height);
  hatStrich = false;
  document.getElementById('senden').disabled = true;
}

function sendeSig() {
  if (!hatStrich || !aktAuftrag) return;
  var knopf = document.getElementById('senden');
  knopf.disabled = true; knopf.textContent = 'Wird gesendet …';
  var bild = document.getElementById('sig').toDataURL('image/png');
  anfrage('/auftrag/' + aktAuftrag.id + '/unterschrift', { method: 'POST', body: JSON.stringify({ unterschrift: bild }) })
    .then(function () { zeigeFertig(); })
    .catch(function (e) {
      document.getElementById('fehler').textContent = e.message;
      knopf.disabled = false; knopf.textContent = 'Unterschrift bestätigen';
    });
}

function zeigeFertig() {
  aktAuftrag = null;
  buehne.innerHTML =
    '<div class="karte fertig">' +
      '<div class="haken">&#10003;</div>' +
      '<div style="font-size:21px;font-weight:600;margin-bottom:6px">Vielen Dank</div>' +
      '<div style="color:var(--grau);font-size:16px">Die Unterschrift ist übermittelt. Bitte gib das Gerät zurück.</div>' +
    '</div>';
  setTimeout(zeigeWarten, 6000);
}

// ── Nachfragen statt Dauerverbindung: ein Gerät, das kurz das WLAN verliert, findet so
// von selbst zurück, ohne dass jemand etwas neu startet.
function umfrage() {
  anfrage('/auftrag')
    .then(function (d) {
      kopf(d.station);
      if (d.auftrag && (!aktAuftrag || aktAuftrag.id !== d.auftrag.id)) zeigeAuftrag(d.auftrag);
      else if (!d.auftrag && aktAuftrag) zeigeWarten();
      else if (!d.auftrag && !aktAuftrag && !buehne.innerHTML) zeigeWarten();
    })
    .catch(function (e) {
      if (e.code === 'STATION_WEG' || e.status === 401) {
        localStorage.removeItem('rp_station'); GEHEIMNIS = ''; stoppeUmfrage();
        zeigeKopplung('Diese Station wurde im Admin entfernt oder neu gekoppelt.');
      }
    });
}
function starteUmfrage() { zeigeWarten(); umfrage(); stoppeUmfrage(); umfrageTimer = setInterval(umfrage, 3000); }
function stoppeUmfrage() { if (umfrageTimer) clearInterval(umfrageTimer); umfrageTimer = null; }

if (GEHEIMNIS) starteUmfrage(); else zeigeKopplung('');
</script>
</body>
</html>
