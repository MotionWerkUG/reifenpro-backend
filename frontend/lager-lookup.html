<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Lagerplatz-Info — Schröder &amp; Scholz</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
  .top{background:#171717;border-bottom:3px solid #eab308;padding:14px 18px;font-weight:800;letter-spacing:.5px}
  .top span{color:#eab308}
  .wrap{max-width:560px;margin:0 auto;padding:18px}
  .card{background:#161b22;border:1px solid #2a3441;border-radius:14px;padding:18px;margin-bottom:14px}
  .platz{background:#eab308;color:#171717;border-radius:14px;padding:18px;text-align:center;margin-bottom:14px}
  .platz .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.8}
  .platz .val{font-size:40px;font-weight:900;line-height:1.1;word-break:break-word}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #232b36;font-size:15px}
  .row:last-child{border-bottom:none}
  .row .k{color:#8b949e}.row .v{font-weight:600;text-align:right}
  .kz{font-family:monospace;color:#eab308}
  .status{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  button{border:none;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;flex:1;min-width:120px}
  .b-p{background:#eab308;color:#171717}.b-g{background:#21262d;color:#e6edf3;border:1px solid #2a3441}
  input{width:100%;background:#0d1117;border:1px solid #2a3441;border-radius:10px;color:#e6edf3;padding:13px;font-size:16px;margin-bottom:10px}
  .msg{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:12px;display:none}
  .msg.err{background:#3a1113;color:#ffb4b4;border:1px solid #632}
  .msg.ok{background:#0f2e1d;color:#7ee2a8;border:1px solid #285}
  .muted{color:#8b949e;font-size:13px}
  h1{font-size:17px;margin-bottom:12px}
</style>
</head>
<body>
<div class="top">SCHRÖDER <span>&amp;</span> SCHOLZ · Lager</div>
<div class="wrap">
  <div class="msg" id="msg"></div>
  <div id="login" style="display:none">
    <div class="card">
      <h1>Anmelden</h1>
      <input id="l-email" type="email" placeholder="E-Mail" autocapitalize="none">
      <input id="l-pass" type="password" placeholder="Passwort">
      <button class="b-p" onclick="doLogin()">Anmelden</button>
    </div>
  </div>
  <div id="content"></div>
</div>
<script>
'use strict';
var API = (location.pathname.indexOf('/reifenpro/') === 0) ? '/reifenpro/api' : '/api';
var TOKEN = localStorage.getItem('rp_token');
var BELEG = new URLSearchParams(location.search).get('beleg') || '';
var CUR = null;

function msg(t, cls){ var m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(cls||''); m.style.display=t?'block':'none'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function api(method, path, body){
  var o={ method:method, headers:{'Content-Type':'application/json'} };
  if(TOKEN) o.headers['Authorization']='Bearer '+TOKEN;
  if(body!==undefined) o.body=JSON.stringify(body);
  return fetch(API+path, o).then(function(r){
    if(r.status===401){ TOKEN=null; localStorage.removeItem('rp_token'); throw {auth:true}; }
    if(!r.ok) return r.json().catch(function(){return{};}).then(function(e){ throw new Error(e.error||('Fehler '+r.status)); });
    return r.json();
  });
}

function zeige(){
  document.getElementById('login').style.display = TOKEN ? 'none' : 'block';
  if(TOKEN){ laden(); } else { document.getElementById('content').innerHTML=''; }
}

function doLogin(){
  var email=document.getElementById('l-email').value.trim();
  var pass=document.getElementById('l-pass').value;
  fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,passwort:pass})})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||'Login fehlgeschlagen'); return j; }); })
    .then(function(j){ TOKEN=j.token; localStorage.setItem('rp_token',TOKEN); msg(''); zeige(); })
    .catch(function(e){ msg(e.message,'err'); });
}

function stColor(s){ return s==='Abgeholt'?'#8b949e':(s==='Abholbereit'?'#eab308':'#3ecf8e'); }

function laden(){
  if(!BELEG){ document.getElementById('content').innerHTML='<div class="card">Kein Beleg angegeben.</div>'; return; }
  api('GET','/einlagerungen/'+encodeURIComponent(BELEG)).then(function(e){
    CUR=e;
    var fahrzeug=[e.fahrzeug_marke,e.fahrzeug_modell].filter(Boolean).join(' ');
    var html='<div class="platz"><div class="lbl">Lagerplatz</div><div class="val">'+esc(e.lagerplatz||'—')+'</div></div>'+
      '<div class="card">'+
        row('Beleg-Nr.', esc(e.beleg_nr))+
        row('Status', '<span class="status" style="background:'+stColor(e.status)+'22;color:'+stColor(e.status)+'">'+esc(e.status)+'</span>')+
        row('Kunde', esc(e.kundenname||'—'))+
        row('Kennzeichen', '<span class="kz">'+esc(e.kennzeichen||'—')+'</span>')+
        (fahrzeug?row('Fahrzeug', esc(fahrzeug)):'')+
        row('Reifen', esc((e.reifen_typ||'')+' '+(e.reifen_groesse||'')))+
        ((e.reifen_marke||e.reifen_modell)?row('Fabrikat', esc((e.reifen_marke||'')+' '+(e.reifen_modell||''))):'')+
        (e.dot?row('DOT', esc(e.dot)):'')+
        (e.anzahl?row('Anzahl', esc(e.anzahl)):'')+
        row('Eingelagert', esc((e.eingelagert_am||'').substring(0,10)))+
      '</div>'+
      '<div class="card"><div class="muted" style="margin-bottom:8px">Status ändern</div><div class="btns">'+
        '<button class="b-g" onclick="setStatus(\'Eingelagert\')">Eingelagert</button>'+
        '<button class="b-p" onclick="setStatus(\'Abholbereit\')">Abholbereit</button>'+
        '<button class="b-g" onclick="setStatus(\'Abgeholt\')">Abgeholt</button>'+
      '</div></div>'+
      '<div class="card"><div class="muted" style="margin-bottom:8px">Protokoll</div><div class="btns">'+
        '<button class="b-g" onclick="location.href=\'protokoll.html?beleg='+encodeURIComponent(e.beleg_nr)+'\'">Annahme-/Übergabeprotokoll erstellen</button>'+
      '</div></div>';
    document.getElementById('content').innerHTML=html;
    msg('');
  }).catch(function(e){
    if(e&&e.auth){ zeige(); return; }
    document.getElementById('content').innerHTML='<div class="card">'+esc(e.message||'Nicht gefunden.')+'</div>';
  });
}
function row(k,v){ return '<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>'; }

function setStatus(s){
  if(!CUR) return;
  api('PATCH','/einlagerungen/'+CUR.id+'/status',{status:s})
    .then(function(){ msg('Status: '+s,'ok'); laden(); })
    .catch(function(e){ if(e&&e.auth){zeige();return;} msg(e.message||'Fehler','err'); });
}

zeige();
</script>
</body>
</html>
