server {
    server_name www.schroeder-scholz.de;
    access_log /var/log/nginx/schroeder-scholz.access.log ss_statistik;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location /portal/ {
        root /var/www/reifenpro;
        try_files $uri $uri/ /portal/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        root /var/www/schroeder-homepage;
        index index.html;
        # Unbekannte Adressen antworten 404 statt die Startseite auszuliefern.
        # Vorher bekam JEDER Pfad HTTP 200 mit der kompletten Startseite -- auch /.env,
        # /wp-login.php oder /gibtesnicht. Folgen: Suchmaschinen halten beliebig viele Adressen
        # fuer echte Seiten (doppelter Inhalt), und wer das System absucht, bekommt auf jeden
        # Versuch eine Erfolgsmeldung -- wir sehen in der Statistik dann auch nicht mehr, wonach
        # gesucht wurde.
        # Geprueft vor der Umstellung: KEINE Oberflaeche nutzt Pfad-Routen. Buchung und
        # Preisseite haben gar keine, Admin und Portal arbeiten mit #-Ankern, die den Server nie
        # erreichen. Alle echten Seiten sind Ordner mit index.html, die $uri/ ohnehin findet.
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { root /var/www/schroeder-homepage; internal; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.schroeder-scholz.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.schroeder-scholz.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name admin.schroeder-scholz.de;
    root /var/www/reifenpro;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    location / {
        # Wie bei www: unbekannte Adressen sind 404, nicht die Anmeldeseite. Der Admin nutzt
        # #-Anker fuer seine Seitenwechsel, keine Pfade -- der Rueckfall wurde nie gebraucht.
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html { root /var/www/reifenpro; internal; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.schroeder-scholz.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.schroeder-scholz.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.schroeder-scholz.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.schroeder-scholz.de;
    return 404; # managed by Certbot


}

server {
    if ($host = admin.schroeder-scholz.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.schroeder-scholz.de;
    return 404; # managed by Certbot


}
server {
    listen 80;
    server_name schroeder-scholz.de;
    location /.well-known/acme-challenge/ { root /var/www/schroeder-homepage; }
    location / { return 301 https://www.schroeder-scholz.de$request_uri; }
}

server {
    listen 443 ssl;
    server_name schroeder-scholz.de;
    ssl_certificate /etc/letsencrypt/live/schroeder-scholz.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schroeder-scholz.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.schroeder-scholz.de$request_uri;
}
